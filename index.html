<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Dota Mate</title>
<link rel="stylesheet" href="css/tokens.css">
<style>
/* Layout: sticky top bar (bottom tab bar on phones), one content column with a two-column dashboard.
   Deliberately a single dark look: graphite surfaces, muted red accent, gold only for ratings. */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(900px 420px at 8% -8%,var(--danger-soft),transparent 60%),var(--bg);color:var(--fg);font:400 15.5px/1.5 var(--f-body);min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#13151a;z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--f-disp);font-weight:500;letter-spacing:.03em;text-transform:uppercase;margin:0;text-wrap:balance}
h1{font-size:1.9rem;line-height:1.15}
h2{font-size:1.1rem;color:var(--fg-2)}
h3{font-size:1rem}
p{margin:0}
small,.sm{font-size:.84rem;color:var(--mute)}
.mono{font-family:var(--f-mono);font-size:.84rem}
:focus-visible{outline:2px solid var(--red-hi);outline-offset:2px;border-radius:6px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto}

/* icons */
.ic{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:31;background:rgba(19,21,26,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:16px;height:60px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;font-family:var(--f-disp);font-size:1.2rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.brand svg{width:26px;height:26px}
.tabs{display:flex;gap:4px;margin-left:12px}
.tab{display:flex;align-items:center;gap:8px;background:none;border:0;border-radius:8px;padding:8px 12px;color:var(--fg-2)}
.tab:hover{background:var(--card)}
.tab[aria-current=page]{color:var(--fg);background:var(--red-soft);box-shadow:inset 0 -2px 0 var(--red)}
.grow{flex:1}
.me{display:flex;align-items:center;gap:8px;color:var(--fg-2)}

/* bottom nav (phones) */
#nav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav .row{display:grid;grid-template-columns:repeat(5,1fr)}
#nav .tab{flex-direction:column;gap:2px;font-size:.72rem;border-radius:0;padding:9px 4px 8px}
#nav .tab .ic{width:1.35em;height:1.35em}
#nav .tab[aria-current=page]{box-shadow:inset 0 2px 0 var(--red)}

main{padding-top:24px;padding-bottom:56px;display:flex;flex-direction:column;gap:24px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.pagehead p{color:var(--fg-2);margin-top:4px;max-width:60ch}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card-2);border-radius:9px;padding:9px 14px;font-weight:600;min-height:40px;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--border-hover);background:var(--surface-raise)}
.btn.primary{background:var(--red);border-color:#c04048;color:#fff}
.btn.primary:hover{background:#bb3a43}
.btn.ghost{background:none}
.btn.danger{color:var(--danger-text);border-color:rgba(240,68,82,.4);background:var(--danger-soft)}
.btn.danger:hover{background:var(--danger-soft)}
.btn.sm2{padding:5px 10px;min-height:32px;font-size:.88rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.iconbtn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;border:1px solid transparent;background:none;color:var(--fg-2)}
.iconbtn:hover{background:var(--card-2);color:var(--fg)}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.card.flat{background:none}
.stack{display:flex;flex-direction:column;gap:12px}
.cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:24px;align-items:start}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}

/* status pill */
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:5px 12px;font-size:.88rem;background:var(--card-2);color:var(--fg-2);border:1px solid var(--line)}
.pill.ok{color:var(--success);background:var(--win-soft);border-color:rgba(72,214,160,.35)}
.pill.err{color:var(--danger-text);background:var(--red-soft);border-color:rgba(240,68,82,.4)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid #4a515d;border-top-color:var(--red-hi);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.skel{height:64px;border-radius:12px;background:linear-gradient(90deg,var(--card) 25%,var(--card-2) 50%,var(--card) 75%);background-size:200% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-200% 0}}

/* match rows */
.mlist{display:flex;flex-direction:column;gap:10px}
.mrow{display:grid;grid-template-columns:96px minmax(0,1fr) auto 20px;align-items:center;gap:14px;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.mrow:hover{border-color:var(--border-hover);background:#20242c}
.res{font-family:var(--f-disp);text-transform:uppercase;letter-spacing:.05em;font-size:.82rem;padding:4px 10px;border-radius:6px;text-align:center}
.res.win{background:var(--win-soft);color:var(--success)}
.res.loss{background:var(--red-soft);color:var(--danger-text)}
.mmain{display:flex;flex-direction:column;min-width:0}
.mmain b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mallies{display:flex}
.mallies .av{margin-left:-4px;box-shadow:0 0 0 2px var(--card)}
.mallies .av:first-child{margin-left:0}
.mrow .ch{color:var(--mute)}

/* avatars */
.av{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;font-weight:700;font-size:.82rem;color:var(--text);flex:none;position:relative}
.av.lg{width:64px;height:64px;font-size:1.4rem}
.av.md{width:40px;height:40px;font-size:.95rem}
.av.known::after{content:"";position:absolute;right:-1px;top:-1px;width:9px;height:9px;border-radius:50%;background:var(--red-hi);border:2px solid var(--card)}

/* player rows */
.plist{display:flex;flex-direction:column;gap:10px}
.prow{display:flex;align-items:stretch;width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.prow-main{flex:1;min-width:0;display:grid;grid-template-columns:40px minmax(0,1fr) auto 20px;gap:14px;align-items:center;text-align:left;background:none;border:0;padding:12px 14px;color:inherit}
.prow.has-prof .prow-main{grid-template-columns:40px minmax(0,1fr) auto}
.prow-prof{flex:none;display:flex;align-items:center;gap:6px;padding:0 14px;background:rgba(201,164,92,.06);border:0;border-left:1px solid var(--line);color:var(--bronze-hi);font-weight:600;font-size:.88rem}
.prow-prof:hover{background:var(--bronze-soft)}
.prow-prof .ic{width:16px;height:16px}
.prow:hover{border-color:var(--border-hover);background:#20242c}
.prow-main:focus-visible,.prow-prof:focus-visible{outline-offset:-3px}
@media (max-width:560px){.arow{grid-template-columns:40px minmax(0,1fr)}.arow>.arow-act,.arow>.sm{grid-column:2;justify-content:flex-start}.prow-prof span{display:none}.prow-prof{padding:0 12px}}
.pname{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stars{display:inline-flex;gap:1px;vertical-align:middle}
.stars .ic{width:14px;height:14px;color:#34424F}
.stars .ic.on{color:var(--gold);fill:var(--gold)}
.avg{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;color:var(--fg-2)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;color:var(--mute)}
input[type=text],input[type=number],input[type=datetime-local],select,textarea{width:100%;background:var(--surface-sunk);border:1px solid var(--line);border-radius:9px;padding:9px 12px;min-height:40px}
textarea{resize:vertical;min-height:84px}
input::placeholder,textarea::placeholder{color:var(--text-3)}
.searchbox{position:relative}
.searchbox .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mute)}
.searchbox input{padding-left:38px}
.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) ;gap:12px}
.dsel{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:5px 10px;min-height:32px;font-size:.88rem;max-width:100%}
.toolbar{display:grid;grid-template-columns:minmax(0,1fr) 170px 220px;gap:12px}
.trio{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,3fr) minmax(0,2fr);gap:8px;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

/* banners, notes */
.banner{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px}
.banner.soft{background:var(--red-soft);border-color:rgba(240,68,82,.4)}
.banner.demo{background:var(--warn-soft);border-color:rgba(240,166,74,.4)}
.banner .ic{margin-top:3px;color:var(--red-hi)}
.banner.demo .ic{color:var(--gold)}
.banner p{flex:1;min-width:0}

/* empty */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:36px 16px;border:1px dashed var(--border-hover);border-radius:12px;color:var(--fg-2)}
.empty .ic{width:30px;height:30px;color:var(--mute)}
.empty b{color:var(--fg)}

/* modal */
#modal:empty{display:none}
.ov{position:fixed;inset:0;z-index:50;background:rgba(8,9,12,.74);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.panel{width:min(680px,100%);max-height:100%;overflow:auto;background:var(--card);border:1px solid var(--border-hover);border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.panel-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 18px 12px;position:sticky;top:0;background:var(--card);z-index:1;border-bottom:1px solid var(--line)}
.panel-b{padding:16px 18px 20px;display:flex;flex-direction:column;gap:16px}
.arow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.arow:first-child{border-top:0}
.arow-act{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.erow{display:flex;justify-content:space-between;gap:12px;padding:6px 0;color:var(--fg-2);border-top:1px solid var(--line)}
.erow:first-child{border-top:0}
.tag{display:inline-block;font-size:.76rem;border-radius:6px;padding:1px 8px;background:var(--red-soft);color:var(--danger-text)}
.tag.n{background:var(--card-2);color:var(--fg-2)}
.linkbtn{background:none;border:0;padding:0;color:var(--fg);font-weight:600;text-align:left;text-decoration:underline;text-decoration-color:#555c68;text-underline-offset:3px}
.linkbtn:hover{text-decoration-color:var(--red-hi)}
a{color:var(--accent)}

/* rating editor */
.sbtn{background:none;border:0;padding:3px;color:#34424F;border-radius:6px}
.sbtn .ic{width:30px;height:30px}
.sbtn.on{color:var(--gold)}
.sbtn.on .ic{fill:var(--gold)}
.sbtn:hover{color:var(--accent-strong)}
.cat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.dots{display:flex;gap:6px}
.dot{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface-sunk);color:var(--fg-2);font-weight:600}
.dot.on{background:var(--red);border-color:#c04048;color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.78rem;border-radius:999px;padding:2px 10px;background:var(--card-2);color:var(--fg-2);border:1px solid var(--line)}

/* history */
.hist{display:flex;flex-direction:column;gap:10px}
.hitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.hitem .note{margin-top:8px;color:var(--fg);background:#15181e;border-radius:8px;padding:8px 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.profile-h{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.links{display:flex;gap:14px;flex-wrap:wrap}
.links a{display:inline-flex;gap:6px;align-items:center;font-size:.9rem}

/* toast */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:60;width:min(520px,calc(100% - 32px));pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--surface-raise);border:1px solid var(--border-hover);border-radius:12px;padding:12px 14px;box-shadow:0 12px 30px rgba(0,0,0,.45)}

.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 16px}
.kv dt{color:var(--mute)}
.kv dd{margin:0;overflow-wrap:anywhere}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--fg-2)}
.hr{height:1px;background:var(--line);border:0;margin:0}
.statline{display:flex;gap:20px;flex-wrap:wrap;color:var(--fg-2)}
.statline b{font-family:var(--f-disp);font-weight:500;font-size:1.3rem;color:var(--fg);margin-right:6px}

@media (max-width:820px){
  .cols{grid-template-columns:minmax(0,1fr)}
  .tabs,.me .nm{display:none}
}
@media (max-width:759px){
  #nav{display:block}
  main{padding-bottom:104px}
  #toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .mrow{grid-template-columns:minmax(0,1fr) 20px;grid-template-areas:"a c" "b c" "d c"}
  .mrow .res{grid-area:a;justify-self:start}
  .mrow .mmain{grid-area:b}
  .mrow .mallies{grid-area:d}
  .mrow .ch{grid-area:c}
  .filters,.toolbar,.grid2{grid-template-columns:minmax(0,1fr)}
  .trio{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .trio input:nth-child(3){grid-column:1/-1}
  .kv{grid-template-columns:minmax(0,1fr)}
  .kv dt{margin-top:6px}
  h1{font-size:1.55rem}
  .hitem{grid-template-columns:minmax(0,1fr)}
  .btn.label-hide span{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}
a.btn{text-decoration:none}
img.av{object-fit:cover}
.av img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;background:var(--surface-raise)}
.optin{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.optin input{width:18px;height:18px;margin-top:3px;accent-color:var(--danger);flex:none}
.me .btn{margin-left:4px}
.me-btn{display:flex;align-items:center;gap:8px;background:none;border:1px solid transparent;border-radius:12px;padding:3px 10px 3px 4px;color:var(--fg-2);font:inherit;cursor:pointer;min-height:40px}
.me-btn:hover{border-color:var(--line);background:rgba(255,255,255,.04);color:var(--fg)}
</style>

(function(){

const pl=(n,a,b,c)=>{n=Math.abs(n)%100;const k=n%10;return n>10&&n<20?c:k>1&&k<5?b:k===1?a:c};
const fd=ts=>new Date(ts*1000).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const fday=ts=>new Date(ts*1000).toLocaleDateString('ru-RU',{day:'numeric',month:'short',year:'numeric'});
const p2=n=>String(n).padStart(2,'0');
const fdur=s=>{s=Math.max(0,s|0);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${p2(m)}:${p2(x)}`:`${m}:${p2(x)}`};
const ago=ts=>{const d=Math.floor((Date.now()/1000-ts)/86400);if(d<1)return'сегодня';if(d===1)return'вчера';if(d<30)return`${d} ${pl(d,'день','дня','дней')} назад`;return fday(ts)};
const hue=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h%360};
const initials=n=>{const t=String(n||'?').replace(/[^\p{L}\p{N} ]/gu,' ').trim().split(/\s+/);return((t[0]||'?')[0]+(t[1]?t[1][0]:'')).toUpperCase()};
const AVRE=/^https:\/\/([a-z0-9-]+\.)+(steamstatic\.com|akamaihd\.net)\//;

const avUrl=sid=>{const u=avOn()&&S.avatars&&S.avatars[sid];return u&&AVRE.test(u)?u:''};

const MODES={1:'All Pick',2:'Captains Mode',3:'Random Draft',4:'Single Draft',5:'All Random',12:'Least Played',16:'Captains Draft',18:'Ability Draft',22:'All Pick',23:'Turbo'};
const MODE_LIST=['All Pick','Turbo','Captains Mode','Random Draft','Single Draft','All Random','Captains Draft','Ability Draft','Другой'];
const CATS=[['team','Командная игра'],['comm','Общение'],['beh','Поведение'],['help','Помощь команде']];
const catsFor=p=>p&&!p.ally?CATS.filter(c=>c[0]==='comm'||c[0]==='beh'):CATS;

/* ---------- state ---------- */
const LS='dotamate.v1';
function fresh(){return{v:1,me:{acc:'',name:'Вы'},matches:[],reviews:{},pnotes:{},tags:{},heroNotes:{},snooze:{},avatars:{},settings:{avatars:true},demo:false,lastSync:null}}
function load(){try{const r=localStorage.getItem(LS);if(r){const j=JSON.parse(r);if(j&&j.v===1&&Array.isArray(j.matches))return j}}catch(e){}return null}
let SRV=null,SERVER=false,svT=null;
function pushState(){fetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json','X-DM':'1'},body:JSON.stringify(S)}).catch(()=>{})}
function save(){
  if(SRV){clearTimeout(svT);svT=setTimeout(pushState,600);return}
  try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
}

function demoData(){
  const now=Math.floor(Date.now()/1000),D=86400;
  const A=['Fenrir','kotleta_pro','Мамкин саппорт','Zolotaya_Ruka','nightowl','Ржавый','Lumen','Dimych','ShadowVK','Aurora'];
  const E=['xXdarkXx','Pelmen','Oleg_228','mid_or_feed','Kiwi','Vitalik','sunrise','Gnom','Tigr','BarsukBoss','Nika','Toxic_Tom'];
  const H=['Crystal Maiden','Axe','Pudge','Lion','Tidehunter','Witch Doctor','Invoker','Io','Spectre','Sniper','Mars','Lich'];
  const sid=i=>String(120000000+i*7919);
  const plan=[[0.3,true,'All Pick','Juggernaut',38,[0,1,2,4]],[1.2,false,'All Pick','Sniper',44,[0,1,6,7]],[3.1,true,'Turbo','Mars',22,[0,5,8,3]],[4.6,false,'All Pick','Juggernaut',51,[1,2,6,9]],[7,true,'All Pick','Axe',33,[0,2,4,5]],[10,true,'Captains Mode','Tidehunter',47,[5,7,8,9]],[14,false,'All Pick','Sniper',29,[1,3,6,8]],[19,true,'Turbo','Juggernaut',19,[0,4,7,9]],[26,true,'All Pick','Mars',41,[2,3,5,6]]];
  const d=fresh();d.demo=true;
  plan.forEach((p,i)=>{
    const pls=[{sid:'me',name:'Вы',hero:p[3],ally:true,me:true}];
    p[5].forEach((a,k)=>pls.push({sid:sid(a),name:A[a],hero:H[(i+a+k)%H.length],ally:true,me:false}));
    for(let k=0;k<5;k++)pls.push({sid:String(130000000+((i*3+k)%E.length)*104729),name:E[(i*3+k)%E.length],hero:H[(i*2+k+3)%H.length],ally:false,me:false});
    d.matches.push({id:'d'+(i+1),start:Math.floor(now-p[0]*D),mode:p[2],ranked:false,win:p[1],dur:p[4]*60+(i*37)%60,hero:p[3],players:pls});
  });
  const rv=(mi,ai,r,cats,note)=>{d.reviews['d'+(mi+1)+'|'+sid(ai)]={rating:r,cats:cats||{},note:note||'',ts:now-mi*D}};
  rv(0,0,5,{team:5,comm:5,beh:5,help:5},'Хорошо коллил, вовремя ставил смоки');
  rv(1,0,4,{team:4,comm:5});rv(2,0,5);rv(4,0,5,{help:5},'Предпочитает играть на саппорте 4');rv(7,0,4);
  rv(1,1,3,{},'Рано сливается после первой смерти');rv(3,1,2,{beh:2,comm:2});rv(6,1,2);
  rv(0,2,4);rv(3,2,3);rv(4,2,5,{help:5},'Варды ставит каждый раунд');
  rv(1,6,4,{team:4});rv(8,6,4,{},'Уверенный мид, но редко отвечает в чат');
  d.reviews['d1|130000000']={rating:3,cats:{beh:3},note:'Любит рано ганкать боковую линию',ts:now-D};
  d.pnotes[sid(0)]='Надёжный напарник. Лучше всего заходит в паре на линии.';
  d.tags[sid(0)]=['party','good'];d.tags[sid(2)]=['support'];d.tags[sid(1)]=['c:Рано сливается'];d.tags['130000000']=['avoid'];
  d.heroNotes[sid(2)]={'Witch Doctor':'Ставит варды и вовремя использует ульт'};

function migrate(st){if(window.DMSocial)DMSocial.ensure(st);for(const m of st.matches||[])for(const p of m.players||[]){if(!p.sid&&!p.ally&&p.name&&p.name!=='Скрытый игрок')p.sid='nick:'+String(p.name).toLowerCase()}return st}
let S=migrate(load()||demoData());
if(!load())save();

const V={more:false,page:'dash',pid:null,f:{res:'all',mode:'all',range:'all'},q:'',sort:'count',dsort:'recent',role:'all',modal:null,draft:null,confirm:null,sync:{st:'idle',msg:''},tab:'link',toast:null,bk:''};

/* ---------- data helpers ---------- */
const rkey=(mid,sid)=>mid+'|'+sid;
const sorted=()=>S.matches.slice().sort((a,b)=>b.start-a.start);
const mById=id=>S.matches.find(m=>m.id===id);
function pIndex(){
  const map={};
  for(const m of S.matches)for(const p of m.players){
    if(p.me||!p.sid)continue;
    const e=map[p.sid]||(map[p.sid]={sid:p.sid,name:p.name,last:0,list:[]});
    e.list.push({m,p,role:p.ally?'ally':'enemy'});
    if(m.start>=e.last){e.last=m.start;e.name=p.name}
  }
  for(const e of Object.values(map)){
    e.list.sort((a,b)=>b.m.start-a.m.start);
    e.count=e.list.length;
    e.withN=e.list.filter(x=>x.role==='ally').length;
    e.vsN=e.count-e.withN;
    const rs=e.list.map(x=>S.reviews[rkey(x.m.id,e.sid)]).filter(r=>r&&r.rating);
    e.rated=rs.length;e.avg=rs.length?rs.reduce((a,r)=>a+r.rating,0)/rs.length:null;
    e.auto=window.DMPerfUI?DMPerfUI.aggFor(e):null;
  }
  return map;
}
function priorSplit(sid,m){
  let w=0,v=0;
  for(const x of S.matches){
    if(x.id===m.id||x.start>=m.start)continue;
    const q=x.players.find(p=>p.sid===sid&&!p.me);
    if(q){if(q.ally)w++;else v++}
  }
  return{w,v,n:w+v};
}
const prior=(sid,m)=>priorSplit(sid,m).n;
const meetText=(role,w,v)=>{
  const a=n=>`${n} ${pl(n,'раз','раза','раз')}`;
  if(role==='ally')return w?`вы уже играли вместе ${a(w)}`+(v?`, против друг друга ${a(v)}`:''):`раньше вы встречались как соперники ${a(v)}`;
  return v?`вы уже встречались как соперники ${a(v)}`+(w?`, вместе играли ${a(w)}`:''):`раньше вы играли вместе ${a(w)}`;
};
const notices=m=>m.players.filter(p=>!p.me&&p.sid).map(p=>Object.assign({p,role:p.ally?'ally':'enemy'},priorSplit(p.sid,m))).filter(x=>x.n>0);
function parseSteam(v){
  v=String(v||'').trim();if(!v)return null;
  const m=v.match(/(?:profiles|players)\/(\d{5,20})/);if(m)v=m[1];
  if(!/^\d{5,20}$/.test(v))return null;
  try{let b=BigInt(v);if(b>=OFF)b-=OFF;if(b<=0n||b>4294967295n)return null;return b.toString()}catch(e){return null}
}
function leaveDemo(){if(S.demo){S.matches=[];S.reviews={};S.pnotes={};S.tags={};S.heroNotes={};S.snooze={};S.demo=false;return true}return false}
function addMatch(m){
  if(S.matches.some(x=>x.id===m.id))throw new Error('Этот матч уже добавлен.');
  const was=leaveDemo();S.matches.push(m);save();return was;
}
function fromOD(j){
  const me=j.players.find(p=>p.account_id!=null&&String(p.account_id)===String(S.me.acc));
  if(!me)throw new Error('Вас нет среди игроков этого матча. Проверьте Steam ID в настройках.');
  const mine=me.player_slot<128;
  const players=j.players.map(p=>({sid:p.account_id!=null?String(p.account_id):null,name:p.personaname||p.name||'Скрытый игрок',hero:HEROES[p.hero_id]||('Герой #'+p.hero_id),ally:(p.player_slot<128)===mine,me:p===me}));
  if(window.DMPerfUI)DMPerfUI.ingest(j);
  return{id:String(j.match_id),start:j.start_time,mode:MODES[j.game_mode]||('Режим '+j.game_mode),ranked:j.lobby_type===7,win:!!j.radiant_win===mine,dur:j.duration,hero:HEROES[me.hero_id]||('Герой #'+me.hero_id),players};
}
function importJson(txt){
  let j;try{j=JSON.parse(txt)}catch(e){throw new Error('Не удалось прочитать JSON. Скопируйте весь текст со страницы данных матча.')}
  if(!j||!Array.isArray(j.players)||j.match_id==null)throw new Error('В тексте нет данных матча. Нужен ответ OpenDota по адресу /api/matches/номер.');
  if(!S.me.acc)throw new Error('NOACC');
  return fromOD(j);
}

/* ---------- toast ---------- */
let tt=null;
function toast(msg,act){V.toast={msg,act};paintToast();clearTimeout(tt);tt=setTimeout(()=>{V.toast=null;paintToast()},act?7000:3800)}
function paintToast(){
  const t=V.toast;
  $('#toast').innerHTML=t?`<div class="toast"><span>${esc(t.msg)}</span>${t.act?`<button class="btn sm2" data-a="${esc(t.act.a)}" data-id="${esc(t.act.id||'')}">${esc(t.act.label)}</button>`:''}</div>`:'';
}

/* ---------- views ---------- */
const NAV=[['dash','home','Главная',1],['matches','list','Матчи',1],['players','users','Игроки',1],['draft','rune','Драфт',1],['me','search','Найти профиль'],['rep','shield','Репутация'],['settings','sliders','Настройки']];
const cur=()=>V.page==='player'?'players':V.page;
const navBtn=n=>`<button class="tab" data-a="go" data-p="${n[0]}" aria-label="${n[2]}" ${cur()===n[0]?'aria-current="page"':''}>${ico(n[1])}<span>${n[2]}</span></button>`;
function navBtns(){return NAV.map(navBtn).join('')}
/* Телефон: четыре главных раздела и «Ещё» со всем остальным. */
function mobNav(){
  const rest=NAV.filter(n=>!n[3]),inRest=rest.some(n=>n[0]===cur());
  return`<div class="row">${NAV.filter(n=>n[3]).map(navBtn).join('')}<button class="tab" data-a="more" aria-expanded="${!!V.more}" aria-haspopup="true" ${inRest?'aria-current="page"':''}>${ico('dots')}<span>Ещё</span></button></div>
  ${V.more?`<div class="more" role="menu" aria-label="Другие разделы">${rest.map(n=>`<button class="more-i ${cur()===n[0]?'on':''}" role="menuitem" data-a="go" data-p="${n[0]}">${ico(n[1])}<span>${n[2]}</span></button>`).join('')}<button class="more-i" role="menuitem" data-a="qk">${ico('search')}<span>Быстрый поиск</span></button></div>`:''}`;
}
function meBlock(){
  const face=SRV&&SRV.avatar?`<img class="av" src="${esc(SRV.avatar)}" alt="" width="32" height="32" referrerpolicy="no-referrer">`:av(S.me.name,'',S.me.acc||'me');
  let act='';
  if(SERVER)act=SRV?`<button class="btn ghost sm2" data-a="logout">Выйти</button>`:`<a class="btn primary sm2" href="/auth/steam">${ico('lock')}<span>Войти через Steam</span></a>`;
  return`<span class="me"><button class="me-btn" data-a="myProfile" data-tip="Мой профиль: статистика, герои и динамика по данным OpenDota" aria-label="Открыть мой профиль">${face}<span class="nm">${esc(S.me.name||'Вы')}</span></button>${act}</span>`;
}
function steamBlock(){
  if(SRV)return`<div class="banner">${ico('check')}<div style="flex:1"><b>Вы вошли через Steam</b><p class="sm" style="margin-top:2px">Данные привязаны к вашему аккаунту и хранятся на сервере Dota Mate.</p></div><button class="btn sm2" data-a="logout">Выйти</button></div>`;
  if(SERVER)return`<div class="banner">${ico('lock')}<div style="flex:1"><b>Вход через Steam</b><p class="sm" style="margin-top:2px">Вход происходит на сайте steamcommunity.com. Пароль Dota Mate не видит, мы получаем только ваш публичный Steam ID.</p></div><a class="btn primary sm2" href="/auth/steam">Войти</a></div>`;
  return`<div class="banner" style="background:none">${ico('lock')}<div><b>Вход через Steam</b><p class="sm" style="margin-top:2px">Steam OpenID требует сервер, который проверяет ответ Steam. Эта страница работает без сервера, поэтому вход недоступен. Аватары игроков подгружаются из OpenDota, а пока их нет, показаны инициалы.</p></div></div>`;
}
function paintHdr(){
  $('#hdr').innerHTML=`<header class="top"><div class="top-in wrap gut">
    <button class="brand" data-a="go" data-p="dash" aria-label="Dota Mate, главная"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2l12 14-12 14L4 16z" fill="#a8323a"/><path d="M16 8l6.5 8L16 24l-6.5-8z" fill="#13151a"/><path d="M16 12.5l3 3.5-3 3.5-3-3.5z" fill="#e8e6e1"/></svg>Dota Mate</button>

}
function syncStatus(){

const sxRec=(e,r)=>window.DMSocialUI?DMSocialUI.recTxt(e,r):'';

/* Адреса вида #/profile/<id>, #/match/<id>, #/episodes/<id>, #/reports …: у каждого игрока, матча и отчёта своя ссылка. */
function route(){
  const h=location.hash.replace(/^#\/?/,'');
  if(!h)return;
  const i=h.indexOf('/'),t=i<0?h:h.slice(0,i);let param=i<0?'':h.slice(i+1);
  try{param=decodeURIComponent(param)}catch(e){}
  const dm=/^draft(?:\/)?(?:\?(.*))?$/.exec(h);
  if(dm){
    const q=dm[1]||'';
    const link=window.DMDraftUI&&q?DMDraftUI.applyLink(q):false;
    if(V.page!=='draft'||link){V.page='draft';V.pid=null;V.modal=null;V.confirm=null;paint();window.scrollTo(0,0)}
    return}
  if(t==='profile'){
    if(V.page!=='me'){V.page='me';V.pid=null;V.modal=null;V.confirm=null;paint();window.scrollTo(0,0)}
    if(window.DMProfile&&/^\d{1,10}$/.test(param)&&DMProfile.current()!==param)DMProfile.open(param);
    return}
  if(window.DMRepUI&&DMRepUI.isTab(t)){
    const was=V.page==='rep';
    DMRepUI.nav(t,param);
    if(!was){V.page='rep';V.pid=null;V.modal=null;V.confirm=null;paint()}
    window.scrollTo(0,0)}
}

async function doSync(){
  if(!S.me.acc){V.sync={st:'error',msg:'Укажите Steam ID в настройках.'};paintMain();return}
  V.sync={st:'loading',msg:'Запрашиваю список матчей…'};paintMain();
  const base=SRV?'/api/od':'https://api.opendota.com/api';
  const get=async u=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),12000);try{const r=await fetch(u,{signal:c.signal});if(r.status===429)throw new Error('RATE');if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(t)}};
  try{
    const list=await get(`${base}/players/${S.me.acc}/matches?limit=15`);
    const fresh=(list||[]).filter(x=>!S.matches.some(m=>m.id===String(x.match_id))).slice(0,5);
    if(!fresh.length){S.lastSync=Math.floor(Date.now()/1000);save();V.sync={st:'ok',msg:list&&list.length?'Новых матчей нет.':'Список пуст. Включите «Открытые данные матчей» в настройках Dota 2.'};paintMain();return}
    let added=0,skipped=0;
    for(let i=0;i<fresh.length;i++){
      V.sync={st:'loading',msg:`Загружаю матч ${i+1} из ${fresh.length}…`};paintMain();
      try{const j=await get(`${base}/matches/${fresh[i].match_id}`);addMatch(fromOD(j));added++}catch(e){if(e.message==='RATE')throw e;skipped++}
      if(i<fresh.length-1)await new Promise(r=>setTimeout(r,1100));
    }
    S.lastSync=Math.floor(Date.now()/1000);save();
    V.sync={st:added?'ok':'error',msg:added?`Добавлено матчей: ${added}${skipped?`, пропущено: ${skipped}`:''}.`:'Подробности матчей пока недоступны. Попробуйте позже.'};
  }catch(e){
    V.sync={st:'error',msg:e.message==='RATE'?'Лимит запросов OpenDota исчерпан. Попробуйте позже.':'Не удалось связаться с OpenDota. Добавьте матч по ссылке: это работает без прямого подключения.'};
  }
  paintMain();paintHdr();
  if(window.DMPerfUI)DMPerfUI.scan(false);
}

function readManual(){
  const g=id=>document.getElementById(id).value.trim();
  const allies=[0,1,2,3].map(i=>({n:g('a-n'+i),s:g('a-s'+i),h:g('a-h'+i)})).filter(a=>a.n);
  if(!allies.length)throw new Error('Добавьте хотя бы одного союзника с ником.');
  const hero=g('x-hero');if(!hero)throw new Error('Укажите вашего героя.');
  const ts=Math.floor(new Date(document.getElementById('x-date').value).getTime()/1000);
  if(!ts)throw new Error('Укажите дату и время.');
  const dur=Number(g('x-dur'));if(!(dur>0))throw new Error('Укажите длительность матча.');
  const pls=[{sid:S.me.acc||'me',name:S.me.name||'Вы',hero,ally:true,me:true}];
  for(const a of allies){
    let sid='nick:'+a.n.toLowerCase();
    if(a.s){const acc=parseSteam(a.s);if(!acc)throw new Error(`Steam ID союзника «${a.n}» не распознан. Нужны цифры или ссылка вида /profiles/…`);sid=acc}
    pls.push({sid,name:a.n,hero:a.h||'—',ally:true,me:false});
  }
  for(let i=0;i<5;i++){
    const n=g('e-n'+i);if(!n)continue;
    const raw=g('e-s'+i);let sid='nick:'+n.toLowerCase();
    if(raw){const acc=parseSteam(raw);if(!acc)throw new Error(`Steam ID соперника «${n}» не распознан. Нужны цифры или ссылка вида /profiles/…`);sid=acc}
    pls.push({sid,name:n,hero:g('e-h'+i)||'—',ally:false,me:false});
  }
  const seen=new Set();
  for(const q of pls){if(!q.sid)continue;if(seen.has(q.sid))throw new Error(`Игрок «${q.name}» указан в матче дважды.`);seen.add(q.sid)}
  return{id:'m'+Date.now(),start:ts,mode:g('x-mode'),ranked:false,win:g('x-res')==='win',dur:Math.round(dur*60),hero,players:pls};
}

      if(!a){toast('Укажите свой Steam ID в настройках, и профиль откроется отсюда');go('settings');break}
      V.more=false;V.page='me';V.pid=null;V.modal=null;V.confirm=null;paint();window.scrollTo(0,0);if(window.DMProfile)DMProfile.open(a);break}
    case'openProfile':V.page='me';V.pid=null;V.modal=null;V.confirm=null;paint();window.scrollTo(0,0);if(window.DMProfile)DMProfile.open(d.id);break;
    case'copy':navigator.clipboard.writeText(d.t).then(()=>toast('Скопировано.'),()=>toast('Не удалось скопировать. Выделите текст вручную.'));break;
    case'saveAcc':{
      const raw=document.getElementById('set-steam').value.trim(),name=document.getElementById('set-name').value.trim()||'Вы';
      if(SRV){}else if(raw){const acc=parseSteam(raw);if(!acc){setMsg('acc-msg','Не удалось распознать ID. Нужен числовой Steam ID или ссылка вида steamcommunity.com/profiles/… (ссылки с именем не подходят).');break}S.me.acc=acc}else S.me.acc='';
      S.me.name=name;save();paint();setMsg('acc-msg','Сохранено.');toast('Настройки сохранены.');break}
    case'importJson':{
      try{const m=importJson(document.getElementById('m-json').value);const was=addMatch(m);newMatchAdded(m,was)}
      catch(err){setMsg('add-err',err.message==='NOACC'?'Сначала укажите свой Steam ID в настройках.':err.message)}
      break}
    case'addManual':{
      try{const m=readManual();const was=addMatch(m);newMatchAdded(m,was)}catch(err){setMsg('add-err',err.message)}
      break}
    case'bkShow':{V.bk=JSON.stringify(S);document.getElementById('bk').value=V.bk;setMsg('bk-msg','Копия готова. Нажмите «Скопировать».');break}
    case'bkCopy':{
      const ta=document.getElementById('bk');if(!ta.value){V.bk=JSON.stringify(S);ta.value=V.bk}
      navigator.clipboard.writeText(ta.value).then(()=>setMsg('bk-msg','Скопировано.'),()=>{ta.focus();ta.select();setMsg('bk-msg','Текст выделен. Скопируйте его вручную.')});break}
    case'bkRestore':{
      try{const data=DMSocial.parseImport(document.getElementById('bk').value);S=migrate(DMSocial.replaceWith(S,data));save();V.bk='';paint();toast('Данные восстановлены.')}
      catch(err){setMsg('bk-msg',err.message||'Это не похоже на резервную копию Dota Mate.')}
      break}
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){V.q=t.value;const l=$('#plist');if(l)l.innerHTML=plistHtml()}
  else if(t.id==='pnote'){S.pnotes[t.dataset.sid]=t.value;save()}
  else if(t.id==='m-link'){
    const id=apiLink(t.value),box=document.getElementById('api-box');
    box.innerHTML=id?`Матч <span class="mono">${id}</span>: <a href="https://api.opendota.com/api/matches/${id}" target="_blank" rel="noopener noreferrer">открыть данные матча</a>. Если данных нет, откройте <a href="https://www.opendota.com/matches/${id}" target="_blank" rel="noopener noreferrer">страницу матча на OpenDota</a>: сайт сам запросит матч у Valve.`:'';
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='set-av'){S.settings=S.settings||{};S.settings.avatars=t.checked;save();paint();if(t.checked)scanAvatars();return}
  if(t.id==='prole'){V.role=t.value;$('#plist').innerHTML=plistHtml()}
  else if(t.id==='sort'){V.sort=t.value;$('#plist').innerHTML=plistHtml()}
  else if(t.id==='dsort'){V.dsort=t.value;paintMain()}
  else if(t.id==='f-res'||t.id==='f-mode'||t.id==='f-range'){V.f={res:$('#f-res').value,mode:$('#f-mode').value,range:$('#f-range').value};$('#mlist').innerHTML=mlistHtml()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&V.modal)closeModal()});

/* ---------- аватарки ---------- */
const AV={q:[],busy:false,fail:new Set()};
function putAv(sid,u){
  S.avatars=S.avatars||{};S.avatars[sid]=u;save();
  if(u)document.querySelectorAll('[data-av="'+sid+'"]').forEach(el=>{if(!el.querySelector('img'))el.insertAdjacentHTML('beforeend',avImg(sid))});
}
function scanAvatars(){
  if(!avOn()||S.demo)return;
  document.querySelectorAll('[data-av]').forEach(el=>{
    const sid=el.dataset.av;
    if(S.avatars&&sid in S.avatars)return;
    if(AV.fail.has(sid)||AV.q.includes(sid))return;
    AV.q.push(sid);
  });
  runAv();
}
async function runAv(){
  if(AV.busy)return;AV.busy=true;
  while(AV.q.length&&avOn()&&!S.demo){
    const sid=AV.q.shift();
    try{
      const base=SRV?'/api/od':'https://api.opendota.com/api';
      const c=new AbortController(),tm=setTimeout(()=>c.abort(),8000);
      let r;try{r=await fetch(base+'/players/'+sid,{signal:c.signal})}finally{clearTimeout(tm)}
      if(r.status===429){AV.fail.add(sid);AV.q.length=0;break}
      if(r.status===404)putAv(sid,'');
      else if(!r.ok)throw new Error('http');
      else{const j=await r.json();const u=(j&&j.profile&&(j.profile.avatarmedium||j.profile.avatarfull))||'';putAv(sid,AVRE.test(u)?u:'')}
    }catch(e){AV.fail.add(sid)}
    await new Promise(r=>setTimeout(r,SRV?150:1100));
  }
  AV.busy=false;
}
let avT=null;
new MutationObserver(()=>{clearTimeout(avT);avT=setTimeout(scanAvatars,300)}).observe(document.body,{childList:true,subtree:true});
document.addEventListener('error',e=>{const t=e.target;if(t&&t.tagName==='IMG'&&t.closest&&t.closest('[data-av]'))t.remove()},true);

    else if(x.id==='sync'){go('dash');doSync()}

    else if(x.id==='settings')go('settings')}});
if(window.DMDash)DMDash.init({S:()=>S,matches:()=>sorted(),pIndex,av,stars,pl,ago,fd,fday,rec:(e,r)=>sxRec(e,r),myAcc:()=>SRV&&SRV.acc?String(SRV.acc):(S&&S.me&&S.me.acc&&isNum(S.me.acc)?String(S.me.acc):''),
  loading:()=>V.sync.st==='loading',syncStatus,demoBanner,toast:m=>toast(m),paintMain,server:()=>SERVER,

paint();

(async function init(){
  try{
    const r=await fetch('/api/session',{headers:{'X-DM':'1'}});
    let j=null;try{j=await r.json()}catch(e){}
    if(!j||j.server!==true)return;
    SERVER=true;
    if(window.DMComm)DMComm.reset();if(window.DMRepUI)DMRepUI.resetStatus();
    if(r.ok&&j.user){
      SRV=j.user;
      const sj=await(await fetch('/api/state')).json();
      const local=load();
      if(sj&&sj.state&&sj.state.v===1)S=sj.state;
      else if(local&&!local.demo&&local.matches.length)S=local;
      else S=fresh();
      migrate(S);S.me=S.me||{};S.me.acc=SRV.acc;
      if(!S.me.name||S.me.name==='Вы')S.me.name=SRV.name||'Вы';
      S.demo=false;
      try{localStorage.removeItem(LS)}catch(e){}
      pushState();
    }
    paint();
  }catch(e){}
})().then(route);
})();
