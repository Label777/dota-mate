<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../css/tokens.css"><style>
html,body{margin:0;width:1200px;height:630px;background:var(--bg);font-family:var(--f-ui);color:var(--text);-webkit-font-smoothing:antialiased}
.wrap{position:relative;height:100%;box-sizing:border-box;padding:64px 80px 60px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.mark{position:absolute;right:-190px;top:50%;transform:translateY(-50%);width:560px;height:560px;opacity:.9}
.top{display:flex;align-items:center;gap:18px;font-weight:700;font-size:34px}
.top svg{width:52px;height:52px}
h1{font-size:58px;line-height:1.1;font-weight:700;letter-spacing:-.02em;margin:0;max-width:720px;position:relative}
p{font-size:26px;line-height:1.45;color:var(--text-2);margin:20px 0 0;max-width:720px}
.row{display:flex;gap:14px;flex-wrap:wrap}
.row span{font-size:22px;font-weight:600;color:var(--text);border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:9px 20px}
.row span b{color:var(--accent);font-weight:700}
.rule{position:absolute;left:0;top:0;width:100%;height:6px;background:var(--accent)}
</style></head><body><div class="wrap"><div class="rule"></div>
<svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2l12 14-12 14L4 16z" fill="none" stroke="#283440" stroke-width=".35"/><path d="M16 6.5l8.2 9.5L16 25.5 7.8 16z" fill="none" stroke="#1D2833" stroke-width=".35"/><path d="M16 11l4.3 5-4.3 5-4.3-5z" fill="none" stroke="#7C6842" stroke-width=".35"/></svg>
<div class="top"><svg viewBox="0 0 32 32"><path d="M16 2l12 14-12 14L4 16z" fill="#C9A66B"/><path d="M16 8l6.5 8L16 24l-6.5-8z" fill="#080D12"/><path d="M16 12.5l3 3.5-3 3.5-3-3.5z" fill="#E8EDF3"/></svg>Dota Mate</div>
<div><h1>Ваши матчи Dota 2 и люди,&nbsp;с&nbsp;которыми вы играли</h1><p>История игр из OpenDota, личные оценки тиммейтов, драфт в реальном времени и MVP каждого матча.</p></div>
<div class="row"><span><b>Без пароля:</b> только публичный Steam ID</span><span>Заметки видны только вам</span></div>
</div></body></html>
